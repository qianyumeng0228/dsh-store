name: build-deploy

on:
  push:
    branches: [main]
  schedule:
    # 每天 03:17 UTC（北京时间 11:17）自动刷新索引
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  # 一轮构建 30-50 分钟，取消在跑的等于丢掉整轮增量成果，改为排队
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 持久化主库：store.db 缓存跨运行保留，git_commit / npm_version 增量字段持续累积。
      # key 必须每次运行都不同：同名 key 的缓存不可覆盖，命中后 post 步会跳过上传，
      # 于是每轮的补齐成果都被丢掉（曾使 store.db 冻结在首日快照）。
      - uses: actions/cache@v4
        with:
          path: |
            data/store.db
            data/store.db-*
          key: dsh-store-db-v1-${{ github.run_id }}
          restore-keys: |
            dsh-store-db-v1-

      - name: Fetch icon source indexes
        run: |
          mkdir -p data/raw
          curl -fsSL --retry 2 --connect-timeout 20 -o data/raw/dshopen.json https://dshopen.org/index.json || echo "dshopen fetch failed (non-fatal)"
          curl -fsSL --retry 2 --connect-timeout 20 -o data/raw/awesome-plugins.json https://awesome-dsh-plugin.com/plugins.json || echo "awesome fetch failed (non-fatal)"

      - name: Seed (dsh.works 种子导入)
        run: python pipeline/seed.py

      - name: Incremental (git commit 补齐 + topic 扫描)
        run: python pipeline/incremental.py --all
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (生成索引与网站)
        run: python pipeline/build.py

      # 把最新索引同步回仓库根目录，供 jsDelivr CDN 镜像（DSH 索引源加速备用）
      # 内容未变化时不提交，避免触发循环构建
      - name: Commit index.json to repo (jsDelivr mirror)
        run: |
          cp dist/index.json ./index.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.json; then
            echo "index.json unchanged; skip commit"
          else
            git add index.json
            git commit -m "chore: update index.json [skip ci]"
            git push origin main
          fi

      - name: Stage site
        run: |
          mkdir -p _site
          cp -r dist/site/* _site/
          cp dist/index.json _site/index.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
